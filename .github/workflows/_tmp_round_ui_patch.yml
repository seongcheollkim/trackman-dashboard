name: Temporary round UI patch runner

on:
  push:
    branches:
      - feature/round-record

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/round-record
          fetch-depth: 0

      - name: Apply round UI integration
        run: |
          if git log -1 --pretty=%s | grep -Fxq 'feat: integrate round record into main tabs'; then
            echo 'Already patched.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from ui.round_record import render_round_record\n'
          if import_line not in text:
              marker = 'import streamlit as st\n'
              if marker not in text: raise SystemExit('streamlit import not found')
              text = text.replace(marker, marker + '\n' + import_line, 1)

          old_tabs = "analysis_tabs = st.tabs(['📊 평균 분석', '🎯 샷별 분석', '🤖 AI 스윙 진단', '📓 연습 일지'])"
          new_tabs = "analysis_tabs = st.tabs(['📊 평균 분석', '🎯 샷별 분석', '🤖 AI 스윙 진단', '📓 연습 일지', '⛳ 라운드 기록'])"
          if old_tabs in text:
              theme = '''# Global dark/readable component theme\nROUND_APP_THEME_CSS = """\n<style>\n.stApp, .stApp p, .stApp label, .stApp h1, .stApp h2, .stApp h3, .stApp h4, .stApp [data-testid="stMarkdownContainer"], .stApp [data-testid="stWidgetLabel"], .stApp [data-testid="stCaptionContainer"] { color:#eef4fb !important; opacity:1 !important; }\n.stApp [data-testid="stCaptionContainer"], .stApp .stCaption { color:#b7c5d5 !important; }\n.stApp input, .stApp textarea, .stApp [contenteditable="true"] { background:#0d1721 !important; color:#f4f8ff !important; }\n.stApp [data-baseweb="select"] > div, .stApp [data-baseweb="input"] > div, .stApp [data-baseweb="textarea"] > div { background:#0d1721 !important; color:#f4f8ff !important; border-color:#31445a !important; }\n.stApp [data-baseweb="select"] span, .stApp [data-baseweb="select"] input, .stApp [data-baseweb="select"] div { color:#f4f8ff !important; }\n.stApp [data-testid="stDataFrame"], .stApp [data-testid="stDataEditor"] { background:#0d1721 !important; border:1px solid #263548 !important; border-radius:10px !important; }\n.stApp [data-testid="stDataFrame"] *, .stApp [data-testid="stDataEditor"] * { color:#eef4fb !important; }\n.stApp [data-testid="stDataEditor"] [role="columnheader"] { background:#142232 !important; }\n.stApp [data-testid="stDataEditor"] [role="gridcell"] { background:#0d1721 !important; }\n.stApp .stTabs [data-baseweb="tab-list"] { background:#0c1520 !important; }\n.stApp .stTabs [data-baseweb="tab"] { color:#d7e1ec !important; }\n.stApp .stTabs [aria-selected="true"] { color:#ff8a32 !important; }\n.stApp .stButton > button, .stApp [data-testid="stFormSubmitButton"] button { color:#ffffff !important; background:#172638 !important; border-color:#42566e !important; }\n</style>\n"""\nst.markdown(ROUND_APP_THEME_CSS, unsafe_allow_html=True)\n\n'''
              text = text.replace(old_tabs, theme + new_tabs, 1)
          elif new_tabs not in text: raise SystemExit('analysis tabs not found')

          practice = '''with analysis_tabs[3]:\n    render_practice_journal_tab(\n        user_email=AUTH_EMAIL,\n        initial_date=selected_date,\n    )'''
          round_block = practice + '''\n\n\n# Phase 4 · Round Record\nwith analysis_tabs[4]:\n    render_round_record(user_email=AUTH_EMAIL)'''
          if 'with analysis_tabs[4]:' not in text:
              if practice not in text: raise SystemExit('practice block not found')
              text = text.replace(practice, round_block, 1)
          path.write_text(text, encoding='utf-8')

          page = Path('pages/4_⛳_라운드_기록.py')
          if page.exists(): page.unlink()
          PY

      - name: Commit to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate round record into main tabs' || exit 0
          git push origin HEAD:feature/round-record
